services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "8000:8000"
    volumes:
      - user_data:/code/data
    environment:
      PRODUCT_SERVICE_URL: "http://product-service:8001"
    depends_on:
      - product-service

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product
    ports:
      - "8001:8001"

volumes:
  user_data: